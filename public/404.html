<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gabriel Gouveia</title>
    <script>
      // Single Page Application routing fix for GitHub Pages
      // Redirects all 404s back to the app with the path encoded as a query string
      // which is then decoded by the redirect handler in index.html
      (function () {
        var segmentCount = 1; // Number of path segments for the repo (1 for /Portif-lio-Gabriel-Gouveia)
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
